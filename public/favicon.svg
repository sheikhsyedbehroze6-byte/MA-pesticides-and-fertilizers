<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Rich Pine & Forest Green) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d31"/>
      <stop offset="60%" stop-color="#123a23"/>
      <stop offset="100%" stop-color="#0a2214"/>
    </linearGradient>
    
    <!-- Sprout Gradient (Vibrant High-Contrast Emerald) -->
    <linearGradient id="sprout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="35%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Leaf Soft Translucent Fill -->
    <linearGradient id="leafGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#16a34a" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base (Apple/Android style radius 112 on 512) -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  
  <!-- Sleek Accent Border -->
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#ring)" stroke-width="6"/>

  <!-- Centered Sprout Symbol (ViewBox 24x24 scaled by 16.5 to ~396px, centered) -->
  <g transform="translate(58, 58) scale(16.5)" filter="url(#shadow)">
    <!-- Soil Line (Ground) -->
    <path d="M5 21h14" stroke="url(#sprout)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Primary Left Seedling Leaf -->
    <path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4" fill="url(#leafGlow)" stroke="url(#sprout)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Growing Stem & Upper Right Canopy Leaf -->
    <path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3" stroke="url(#sprout)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>